name: makinist-atama

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_ADI:?.env içinde DB_ADI tanımlı olmalı}
      POSTGRES_USER: ${DB_KULLANICI:?.env içinde DB_KULLANICI tanımlı olmalı}
      POSTGRES_PASSWORD: ${DB_PAROLA:?.env içinde DB_PAROLA tanımlı olmalı}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - makinist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Üretim: docker compose --profile app up -d --build   (profil yoksa yalnız db açılır: geliştirme)
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_ADI: ${DB_ADI}
      DB_KULLANICI: ${DB_KULLANICI}
      DB_PAROLA: ${DB_PAROLA}
      MAKINIST_COOKIE_SECURE: ${MAKINIST_COOKIE_SECURE:-false}
      MAKINIST_ADMIN_EPOSTA: ${MAKINIST_ADMIN_EPOSTA:-}
      MAKINIST_ADMIN_SIFRE: ${MAKINIST_ADMIN_SIFRE:-}
    # TLS ters vekil aynı makinedeyse APP_ADRESI=127.0.0.1 yapın (uygulama dışarıdan doğrudan erişilmesin)
    ports:
      - "${APP_ADRESI:-0.0.0.0}:${APP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

# Adlı hacim: `docker compose down -v` geliştirme verisini siler, kullanma.
volumes:
  makinist_pgdata:
